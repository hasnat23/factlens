[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factlens"
version = "0.1.0"
description = "Sentence-level hallucination detection for LLM summaries and RAG answers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Hasnat" }]
keywords = ["llm", "hallucination", "factuality", "nli", "rag", "evaluation", "summarization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = ["torch>=2.1", "transformers>=4.40"]

[project.optional-dependencies]
app = ["gradio>=4"]
bench = ["datasets>=3", "scikit-learn>=1.3", "numpy"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
factlens = "factlens.cli:main"

[project.urls]
Homepage = "https://github.com/hasnat23/factlens"
Issues = "https://github.com/hasnat23/factlens/issues"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
